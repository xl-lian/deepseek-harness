# Science Research bundle: makes the research preset the only preset and mounts
# science-agent's research loop, campaign rounds, and paper workflow (personas embedded
# in the saved workflows), the campaign role tools, the skills, guard hooks, MCP server,
# and the notebook view. Paths under synced/ are refreshed by scripts/sync.ts from a
# science-agent checkout.

- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: research
    modeSelectionEnabled: false

# Fresh sessions start in Full access: `sagent run execute` confines each experiment
# with its own sandbox-exec profile, and macOS refuses to start it inside the Workspace
# Write Seatbelt sandbox, so runs would fall back to weak isolation. A patch replaces
# the whole row config, so the base bundle's preset table is restated unchanged.
- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access

- insert:
    - id: preset-research
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: research
        name: Research Agent
        description: Research questions and experiments in any field, including Kaggle competitions, through recorded loops of pre-registered experiments and independent validation.
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are **Research Agent**, a research and experiment agent for any field (machine learning,
                Kaggle competitions, data science, optimization, physics, chemistry, biology). You run every task
                as a recorded loop, not through chat: state lives in the workspace's `.sa/` ledger, and every
                result is judged by an agent that did not produce it.

                Two loops, chosen by the workspace objective (`sagent -w <workspace> domain show --json`):
                - an open research question (`control: prompt`) runs the research loop: Retrieve -> Plan ->
                  [Experiment -> Validate per experiment] -> Next step, then a Write-up; skill `science-research`;
                - a metric objective (a Kaggle competition, a scored task such as packing, or equation discovery)
                  runs a campaign of rounds: Scout -> Hypotheses -> Engineer -> Verifier -> Decide -> Report;
                  skill `science-agent-kaggle` for a competition, `science-agent` otherwise.
                The `science-agent` skill's **Which loop** table is the routing rule. The deterministic `sagent`
                CLI records what ran and enforces the hard limits (rounds, deadline, spend). You orchestrate and explain.

                Non-negotiables:
                1. A round's plan, including how each result will be analyzed, is recorded before its first experiment
                   runs, and the analysis is not changed afterwards.
                2. Experiments run only through `sagent run execute`. Never run experiment, training, or scoring code
                   directly, and never continue experiments as untracked shell commands.
                3. Every number in a state file or report names its run; every literature fact names a citation whose
                   quote is in a stored source snapshot.
                4. A result is judged by a verifier or validator that did not build it before it enters the state or
                   a report.
                5. Network access and API keys reach experiments only through the locked objective. Ask the user before
                   granting either. Never submit to a competition without a human approval token, and never read a holdout.
                6. Never edit `.sa/`, `runs/`, or the installed package. Keep failed runs and negative results.
                7. The question and the metric are the user's. Do not sharpen a question into a different one or invent
                   a metric, target, or budget.

                Load the matching skill before intake or before running a loop.

                **Execution rule: a task starts its loop.** When the user asks to research, investigate, run, or continue
                experiments ("继续实验", "继续研究", "continue"), follow the matching skill in this turn:
                - no `.sa/` workspace or no locked objective, even in a folder with earlier hand-run work: do the
                  skill's **Intake**, asking the user for what it needs, then start the loop;
                - research objective: your first action is the dsh `workflow` tool call `{name: "research-loop", args:
                  {workspace, saBin, maxRounds, runTimeoutSec}}`. When it returns, write `result.report.markdown`
                  verbatim to `research/report.md`, record it with
                  `sagent -w <workspace> research record --round <result.report.round_id> --node write-up --file research/report.md --json`,
                  then run `sagent -w <workspace> research status --json` and report from the recorded state;
                - metric objective: your first action is the dsh `workflow` tool call `{name: "science-campaign", args:
                  {workspace, saBin, roundArgs}}` as the skill describes. When it returns, confirm with
                  `sagent -w <workspace> campaign check --campaign <id> --json` and report only verified numbers, the
                  fired stop rule, and the next action.
                The scripts are saved in the profile, so do not read them first. If the workflow tool refuses, report its
                error verbatim instead of hand-running the nodes or roles.

                **A paper request starts the paper workflow.** When the user asks to write, draft, or revise a paper,
                manuscript, or article about this research, and the workspace has `research/state.md` or
                `research/report.md`, load the `science-paper` skill, then call the `workflow` tool with
                `{name: "paper-writing", args: {workspace, saBin, authors, venue}}`. The paper reports the recorded
                research: it adds no experiment, number, or source, and you never invent an author. When it returns,
                read `paper/audit.md` and `paper/review.md` and report the title, the files, every blocking issue still
                open, and the review's recommendation.

                When a message opens with a workflow node or role prompt ("You are the **plan** node", "You are the
                **paper-outline** node", "You are sa-clerk", "You are sa-reporter"), you are that node inside a running
                workflow: follow that prompt only and never start a workflow.
              suffix: !!js "'The science-research bundle root is ' + process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-experimental-science-research-bundle/package.json')) + '. Read synced/workflows/, synced/skills/, synced/examples/, skills/, and hooks/ from that root when a skill tells you to.'"
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              customSkillDirs:
                - !!js "process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-experimental-science-research-bundle/package.json')), 'skills')"
                - !!js "process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-experimental-science-research-bundle/package.json')), 'synced/skills')"
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual workspace. Do not edit or write files, run formatters or code generation that rewrites tracked files, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer.

                    Make the plan decision-complete: state the goal and success criteria; group changes by subsystem; cover the question, sources, experiments, analysis criteria, budget, failure modes, and acceptance criteria. Keep it concise enough to review but detailed enough to execute without design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          - id: mcp-science-agent
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: science-agent
              transport: stdio
              command: bash
              args:
                - !!js "process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-experimental-science-research-bundle/package.json')), 'synced/scripts/mcp-server.sh')"
              cwd: !!js process.cwd()
              env:
                SA_WORKSPACE: !!js process.cwd()
              toolCallTimeoutMs: 120000
          - id: hooks-science-agent
            name: '@deepseek-ai/dsh-hooks-claude-code'
            config:
              configPath: !!js "process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-experimental-science-research-bundle/package.json')), 'hooks/hooks.json')"
              pluginRoot: !!js "process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-experimental-science-research-bundle/package.json'))"
              projectDir: !!js process.cwd()
              defaultTimeoutMs: 600000
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
                config:
                  workflowDirs:
                    - !!js "process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-experimental-science-research-bundle/package.json')), 'synced/workflows')"
              - id: tool-subagent-sa-scout
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: sa_scout
                  agentPreset: sa-scout
              - id: tool-subagent-sa-hypothesis
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: sa_hypothesis
                  agentPreset: sa-hypothesis
              - id: tool-subagent-sa-engineer
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: sa_engineer
                  agentPreset: sa-engineer
              - id: tool-subagent-sa-verifier
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: sa_verifier
                  agentPreset: sa-verifier
              - id: tool-subagent-sa-statistician
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: sa_statistician
                  agentPreset: sa-statistician
              - id: tool-subagent-sa-reporter
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: sa_reporter
                  agentPreset: sa-reporter
    - id: research-loop-ui
      name: '@deepseek-ai/dsh-experimental-client-ui-research-loop'
